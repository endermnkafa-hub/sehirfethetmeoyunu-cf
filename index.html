<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <title>Şehir & Toprak Fethi</title>
    <style>
      @keyframes sf-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes sf-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(0.96); }
      }
      .sf-boot-screen {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, #111827 0%, #090d16 100%);
        color: #f8fafc;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        z-index: 9999;
      }
      .sf-boot-card {
        max-width: 380px;
        width: 100%;
        background: rgba(15, 23, 42, 0.88);
        border: 1px solid rgba(245, 158, 11, 0.35);
        border-radius: 24px;
        padding: 28px 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      }
      .sf-spinner-wrap {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sf-spinner-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(245, 158, 11, 0.18);
        border-top-color: #f59e0b;
        animation: sf-spin 1.1s linear infinite;
      }
      .sf-boot-title {
        font-size: 18px;
        font-weight: 900;
        color: #ffffff;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      .sf-boot-desc {
        font-size: 13px;
        line-height: 1.5;
        color: #94a3b8;
        margin: 0 0 18px;
      }
      .sf-boot-badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(245, 158, 11, 0.14);
        border: 1px solid rgba(245, 158, 11, 0.3);
        color: #fcd34d;
        font-size: 11px;
        font-weight: 800;
        margin-bottom: 16px;
        animation: sf-pulse 2s ease-in-out infinite;
      }
      .sf-boot-btn {
        display: inline-block;
        width: 100%;
        padding: 11px 16px;
        border-radius: 14px;
        background: #f59e0b;
        color: #090d16;
        font-weight: 900;
        font-size: 12px;
        border: none;
        cursor: pointer;
        text-decoration: none;
      }
    </style>
    <script>
      window.__SF_APP_MOUNTED__ = false;

      window.addEventListener('error', function (e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var titleEl = document.getElementById('sf-boot-title');
          var descEl = document.getElementById('sf-boot-desc');
          if (titleEl) titleEl.textContent = 'Şu Anda Güncelleniyor / Bakım Yapılıyor';
          if (descEl) descEl.textContent = 'Yeni oyun sürümü sunucuya yükleniyor. Birkaç saniye içinde otomatik olarak yeniden bağlanacak...';
          setTimeout(function () {
            window.location.replace(window.location.pathname + '?v=' + Date.now());
          }, 3500);
        }
      }, true);

      setTimeout(function () {
        if (!window.__SF_APP_MOUNTED__) {
          var root = document.getElementById('root');
          if (root && root.querySelector('.sf-boot-screen')) {
            var titleEl = document.getElementById('sf-boot-title');
            var descEl = document.getElementById('sf-boot-desc');
            if (titleEl) titleEl.textContent = 'Şu Anda Güncelleniyor / Bakım Yapılıyor';
            if (descEl) descEl.textContent = 'Sunucuda yeni güncelleme etkinleştiriliyor. Otomatik olarak kontrol ediliyor...';
            setTimeout(function () {
              if (!window.__SF_APP_MOUNTED__) {
                window.location.replace(window.location.pathname + '?v=' + Date.now());
              }
            }, 4000);
          }
        }
      }, 4500);
    </script>
  </head>
  <body class="m-0 p-0" style="background-color: #090d16; color: #f8fafc;">
    <div id="root">
      <div class="sf-boot-screen">
        <div class="sf-boot-card">
          <div class="sf-spinner-wrap">
            <div class="sf-spinner-ring"></div>
            <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
              <path d="M5 26V10H8V13H11V10H14V14H18V10H21V13H24V10H27V26H5Z" fill="#F59E0B" />
            </svg>
          </div>
          <div class="sf-boot-badge">SUNUCU SENKRONİZASYONU</div>
          <h1 id="sf-boot-title" class="sf-boot-title">Şu Anda Güncelleniyor / Bakım Yapılıyor</h1>
          <p id="sf-boot-desc" class="sf-boot-desc">
            Yeni sürüm paketleri kontrol ediliyor. Lütfen bekleyin, birkaç saniye içinde oyun ekranı otomatik olarak açılacak...
          </p>
          <button
            type="button"
            class="sf-boot-btn"
            onclick="window.location.replace(window.location.pathname + '?v=' + Date.now())"
          >
            Şimdi Yeniden Bağlan
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
