name: GitHub Pages Yayinla

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-site:
    name: Web Sitesi Derle (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Paketleri Yukle
        run: npm install

      - name: Web Sitesini Derle
        env:
          VITE_WORKER_WS_URL: ${{ vars.VITE_WORKER_WS_URL }}
        run: npm run build

      - name: GitHub Pages Ayarla
        uses: actions/configure-pages@v5

      - name: Site Dosyalarini Yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-pages:
    name: GitHub Pages Yayinla
    runs-on: ubuntu-latest
    needs: build-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages Yayinla
        id: deployment
        uses: actions/deploy-pages@v4
